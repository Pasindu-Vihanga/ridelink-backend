spring.application.name=account-service
server.port=8081

# MongoDB Configuration (Dedicated persistence boundary for Account Service)
# Supports MongoDB Atlas Cloud via ACCOUNT_MONGODB_URI or MONGODB_ATLAS_URI
spring.data.mongodb.uri=${ACCOUNT_MONGODB_URI:${MONGODB_ATLAS_URI:mongodb://localhost:27017/ridelink_account_db}}
spring.data.mongodb.database=ridelink_account_db
spring.data.mongodb.auto-index-creation=true

# Enable MongoDB Debug Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO
logging.level.com.ridelink=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:mySuperSecretKeyForRideLinkJWTAuthentication2026VerySecureKeyRideLink2026}
jwt.expiration=86400000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html