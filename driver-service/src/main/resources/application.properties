spring.application.name=driver-service
server.port=8082

# MongoDB Persistence Boundary for Driver & Vehicle Service
# Supports MongoDB Atlas Cloud via DRIVER_MONGODB_URI or MONGODB_ATLAS_URI
spring.data.mongodb.uri=${DRIVER_MONGODB_URI:${MONGODB_ATLAS_URI:mongodb://localhost:27017/ridelink_driver_db}}
spring.data.mongodb.database=ridelink_driver_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Debug Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO

# Interservice Communication
services.account-service.url=http://localhost:8081

# JWT Configuration (Shared signature secret for microservices cluster)
jwt.secret=${JWT_SECRET:mySuperSecretKeyForRideLinkJWTAuthentication2026VerySecureKeyRideLink2026}
jwt.expiration=86400000

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
