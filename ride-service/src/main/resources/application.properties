spring.application.name=ride-service
server.port=8083

# MongoDB Persistence Boundary for Ride Management Service
# Supports MongoDB Atlas Cloud via RIDE_MONGODB_URI or MONGODB_ATLAS_URI
spring.data.mongodb.uri=${RIDE_MONGODB_URI:${MONGODB_ATLAS_URI:mongodb://localhost:27017/ridelink_ride_db}}
spring.data.mongodb.database=ridelink_ride_db
spring.data.mongodb.auto-index-creation=true

# Shared JWT Secret
jwt.secret=${JWT_SECRET:mySuperSecretKeyForRideLinkJWTAuthentication2026VerySecureKeyRideLink2026}
jwt.expiration=86400000

# Interservice Communication URLs
services.account-service.url=http://localhost:8081
services.driver-service.url=http://localhost:8082

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
