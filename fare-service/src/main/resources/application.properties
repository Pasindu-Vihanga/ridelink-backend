spring.application.name=fare-service
server.port=8084

# MongoDB Persistence Boundary for Fare & Payment Service
# Supports MongoDB Atlas Cloud via FARE_MONGODB_URI or MONGODB_ATLAS_URI
spring.data.mongodb.uri=${FARE_MONGODB_URI:${MONGODB_ATLAS_URI:mongodb://localhost:27017/ridelink_payment_db}}
spring.data.mongodb.database=ridelink_payment_db
spring.data.mongodb.auto-index-creation=true

# Shared JWT Secret
jwt.secret=${JWT_SECRET:mySuperSecretKeyForRideLinkJWTAuthentication2026VerySecureKeyRideLink2026}
jwt.expiration=86400000

# Interservice Communication URLs
services.ride-service.url=http://localhost:8083

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
