spring.application.name=fare-service
server.port=8084

# MongoDB Configuration for Fare/Payment Service - RideLink Architecture
spring.data.mongodb.uri=mongodb+srv://admin:1234@cluster0.feaigzn.mongodb.net/ridelink_payment_db?retryWrites=true&w=majority
spring.data.mongodb.auto-index-creation=true

# MongoDB Debug Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO

# Shared JWT Secret
jwt.secret=mySuperSecretKeyForRideLinkJWTAuthentication2026VerySecureKeyRideLink2026
jwt.expiration=86400000

# Interservice Communication URLs
services.ride-service.url=http://localhost:8083

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
